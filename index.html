<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальный плеер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .header-actions button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-actions button:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .track-list::-webkit-scrollbar {
            width: 4px;
        }
        .track-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .track-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.04);
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.04);
            position: relative;
        }
        .track-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
        }
        .track-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.05);
        }
        .track-cover {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            flex-shrink: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
        }
        .track-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .track-cover .no-cover {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
        }
        .track-info {
            flex: 1;
            min-width: 0;
        }
        .track-title {
            font-weight: 500;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .track-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 8px;
            transition: 0.2s;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .track-actions button:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .track-actions .edit-btn:hover { color: #60a5fa; }
        .track-actions .delete-btn:hover { color: #f87171; }

        .player {
            margin-top: 20px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .player-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }
        .player-cover {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            flex-shrink: 0;
        }
        .player-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-info {
            flex: 1;
            min-width: 0;
        }
        .player-info .title {
            font-weight: 600;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-info .artist {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 4px 0;
        }
        .player-controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            transition: 0.2s;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-controls button:hover {
            background: rgba(255,255,255,0.08);
            transform: scale(1.05);
        }
        .player-controls .play-btn {
            background: #3b82f6;
            font-size: 30px;
            width: 54px;
            height: 54px;
        }
        .player-controls .play-btn:hover {
            background: #2563eb;
            transform: scale(1.06);
        }
        .player-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.15);
            outline: none;
            transition: 0.2s;
        }
        .player-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }
        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .speed-control label {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        .speed-control input {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.15);
            outline: none;
        }
        .speed-control input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
        }
        .speed-control .speed-value {
            font-size: 14px;
            font-weight: 600;
            color: #a78bfa;
            min-width: 36px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.3);
        }
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 14px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1e1b4b;
            border-radius: 24px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .modal-content h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #e0e7ff;
        }
        .modal-content label {
            display: block;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
            margin-top: 14px;
        }
        .modal-content input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: 0.2s;
        }
        .modal-content input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255,255,255,0.08);
        }
        .modal-content .cover-preview {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            margin: 12px auto;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            border: 2px dashed rgba(255,255,255,0.15);
            transition: 0.3s;
        }
        .modal-content .cover-preview:hover {
            border-color: #3b82f6;
        }
        .modal-content .cover-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-content .cover-preview .placeholder {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            text-align: center;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-actions .save-btn {
            background: #3b82f6;
            color: #fff;
        }
        .modal-actions .save-btn:hover {
            background: #2563eb;
        }
        .modal-actions .cancel-btn {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .modal-actions .cancel-btn:hover {
            background: rgba(255,255,255,0.15);
        }
        #coverInput {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎵 Мой плеер</h1>
        <div class="header-actions">
            <button onclick="addTrack()">➕ Добавить</button>
        </div>
    </div>

    <div class="track-list" id="trackList">
        <!-- Треки рендерятся через JS -->
    </div>

    <div class="player" id="player">
        <div class="player-top">
            <div class="player-cover" id="playerCover">
                <span style="color: rgba(255,255,255,0.3); font-size: 12px;">🎵</span>
            </div>
            <div class="player-info">
                <div class="title" id="playerTitle">Нет трека</div>
                <div class="artist" id="playerArtist">—</div>
            </div>
        </div>
        <div class="player-controls">
            <button onclick="prevTrack()">⏮</button>
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button onclick="nextTrack()">⏭</button>
        </div>
        <input type="range" class="player-slider" id="timeSlider" min="0" max="0" value="0" oninput="seekTrack(this.value)">
        <div class="time-info">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
        <div class="speed-control">
            <label>Скорость</label>
            <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="changeSpeed(this.value)">
            <span class="speed-value" id="speedValue">1.0x</span>
        </div>
    </div>
</div>

<!-- Модалка редактирования -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <h2 id="modalTitle">Редактировать трек</h2>
        <label>Название</label>
        <input type="text" id="editTitle" placeholder="Введите название">
        <label>Исполнитель</label>
        <input type="text" id="editArtist" placeholder="Введите исполнителя">
        <label>Обложка</label>
        <div class="cover-preview" id="coverPreview" onclick="document.getElementById('coverInput').click()">
            <span class="placeholder">Нажмите чтобы<br>загрузить обложку</span>
        </div>
        <input type="file" id="coverInput" accept="image/*" onchange="loadCover(event)">
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeModal()">Отмена</button>
            <button class="save-btn" onclick="saveTrack()">Сохранить</button>
        </div>
    </div>
</div>

<script>
    // ====================== ДАННЫЕ ======================
    let tracks = [];
    let currentTrackId = null;
    let audio = new Audio();
    let isPlaying = false;
    let editIndex = null;
    let tempCoverData = null;

    // Загрузка из localStorage
    function loadData() {
        const saved = localStorage.getItem('tracks');
        if (saved) {
            try {
                tracks = JSON.parse(saved);
            } catch (e) {
                tracks = [];
            }
        }
        // Удаляем треки без URL или с невалидным URL
        tracks = tracks.filter(t => t.url && t.url.startsWith('blob:'));
        renderTracks();
    }

    function saveData() {
        localStorage.setItem('tracks', JSON.stringify(tracks));
    }

    // ====================== ДОБАВЛЕНИЕ ======================
    function addTrack() {
        const input = document.createElement('input');
        input.type = 'file';
        // Явно указываем все аудио форматы
        input.accept = 'audio/mpeg,audio/wav,audio/ogg,audio/aac,audio/flac,audio/x-m4a,audio/mp4,audio/*';
        input.multiple = false;
        
        input.onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // Проверяем что это аудио
            if (!file.type.startsWith('audio/')) {
                alert('Пожалуйста, выберите аудиофайл!');
                return;
            }
            
            const url = URL.createObjectURL(file);
            const track = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                title: file.name.replace(/\.[^/.]+$/, ''),
                artist: 'Неизвестный',
                cover: null,
                url: url
            };
            tracks.push(track);
            saveData();
            renderTracks();
            // Автовоспроизведение
            playTrack(track.id);
        };
        input.click();
    }

    // ====================== ОТРИСОВКА ======================
    function renderTracks() {
        const list = document.getElementById('trackList');
        if (tracks.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🎶</div>
                    <p>Нет треков. Нажмите «Добавить» чтобы загрузить музыку</p>
                </div>
            `;
            return;
        }
        list.innerHTML = tracks.map((track, index) => {
            const isActive = track.id === currentTrackId;
            const coverHtml = track.cover ? 
                `<img src="${track.cover}" alt="cover">` : 
                `<span class="no-cover">🎵</span>`;
            return `
                <div class="track-item ${isActive ? 'active' : ''}" onclick="playTrack('${track.id}')">
                    <div class="track-cover">${coverHtml}</div>
                    <div class="track-info">
                        <div class="track-title">${escapeHtml(track.title)}</div>
                        <div class="track-artist">${escapeHtml(track.artist)}</div>
                    </div>
                    <div class="track-actions">
                        <button class="edit-btn" onclick="event.stopPropagation(); openEdit('${track.id}')">✏️</button>
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteTrack('${track.id}')">🗑️</button>
                    </div>
                </div>
            `;
        }).join('');
        updatePlayerUI();
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ====================== ПЛЕЕР ======================
    function playTrack(id) {
        const track = tracks.find(t => t.id === id);
        if (!track) return;
        
        currentTrackId = id;
        audio.pause();
        audio = new Audio(track.url);
        audio.playbackRate = parseFloat(document.getElementById('speedSlider').value);
        audio.ontimeupdate = updateTime;
        audio.onended = nextTrack;
        audio.onloadedmetadata = function() {
            document.getElementById('timeSlider').max = audio.duration;
            document.getElementById('totalTime').textContent = formatTime(audio.duration);
        };
        audio.play().then(() => {
            isPlaying = true;
            updatePlayerUI();
            updateMediaSession(track);
        }).catch((err) => {
            console.error('Ошибка воспроизведения:', err);
            // Если не удалось воспроизвести, пробуем пересоздать URL
            if (track.url && track.url.startsWith('blob:')) {
                // Пересоздаем blob URL
                fetch(track.url)
                    .then(res => res.blob())
                    .then(blob => {
                        const newUrl = URL.createObjectURL(blob);
                        track.url = newUrl;
                        saveData();
                        playTrack(id);
                    })
                    .catch(() => {});
            }
        });
        renderTracks();
        updatePlayerUI();
    }

    function togglePlay() {
        if (!currentTrackId) {
            if (tracks.length > 0) playTrack(tracks[0].id);
            return;
        }
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
        } else {
            audio.play().then(() => {
                isPlaying = true;
                updateMediaSession(tracks.find(t => t.id === currentTrackId));
            }).catch(() => {});
        }
        updatePlayerUI();
    }

    function nextTrack() {
        const idx = tracks.findIndex(t => t.id === currentTrackId);
        if (idx === -1 || tracks.length === 0) return;
        const next = (idx + 1) % tracks.length;
        playTrack(tracks[next].id);
    }

    function prevTrack() {
        const idx = tracks.findIndex(t => t.id === currentTrackId);
        if (idx === -1 || tracks.length === 0) return;
        const prev = (idx - 1 + tracks.length) % tracks.length;
        playTrack(tracks[prev].id);
    }

    function seekTrack(value) {
        audio.currentTime = value;
        document.getElementById('currentTime').textContent = formatTime(value);
    }

    function updateTime() {
        const slider = document.getElementById('timeSlider');
        slider.value = audio.currentTime;
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        if (audio.duration) {
            document.getElementById('totalTime').textContent = formatTime(audio.duration);
        }
        const track = tracks.find(t => t.id === currentTrackId);
        if (track && isPlaying) {
            updateMediaSession(track);
        }
    }

    function changeSpeed(val) {
        audio.playbackRate = parseFloat(val);
        document.getElementById('speedValue').textContent = val + 'x';
    }

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function updatePlayerUI() {
        const track = tracks.find(t => t.id === currentTrackId);
        const titleEl = document.getElementById('playerTitle');
        const artistEl = document.getElementById('playerArtist');
        const coverEl = document.getElementById('playerCover');
        const playBtn = document.getElementById('playBtn');

        if (track) {
            titleEl.textContent = track.title;
            artistEl.textContent = track.artist;
            coverEl.innerHTML = track.cover ? 
                `<img src="${track.cover}" alt="cover">` : 
                `<span style="color:rgba(255,255,255,0.3);font-size:20px;">🎵</span>`;
        } else {
            titleEl.textContent = 'Нет трека';
            artistEl.textContent = '—';
            coverEl.innerHTML = `<span style="color:rgba(255,255,255,0.3);font-size:20px;">🎵</span>`;
        }
        playBtn.textContent = isPlaying ? '⏸' : '▶';
    }

    // ====================== MEDIA SESSION (Dynamic Island) ======================
    function updateMediaSession(track) {
        if (!track) return;
        if ('mediaSession' in navigator) {
            try {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    album: 'Мой плеер',
                    artwork: track.cover ? [
                        { src: track.cover, sizes: '512x512', type: 'image/jpeg' }
                    ] : []
                });
                navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
                
                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
                navigator.mediaSession.setActionHandler('seekto', (details) => {
                    if (details.seekTime) {
                        audio.currentTime = details.seekTime;
                    }
                });
            } catch (e) {
                console.log('Media Session не поддерживается');
            }
        }
    }

    // ====================== УДАЛЕНИЕ ======================
    function deleteTrack(id) {
        if (!confirm('Удалить трек?')) return;
        const idx = tracks.findIndex(t => t.id === id);
        if (idx === -1) return;
        if (tracks[idx].url && tracks[idx].url.startsWith('blob:')) {
            URL.revokeObjectURL(tracks[idx].url);
        }
        tracks.splice(idx, 1);
        if (currentTrackId === id) {
            audio.pause();
            audio = new Audio();
            isPlaying = false;
            currentTrackId = null;
        }
        saveData();
        renderTracks();
        updatePlayerUI();
    }

    // ====================== РЕДАКТИРОВАНИЕ ======================
    function openEdit(id) {
        editIndex = tracks.findIndex(t => t.id === id);
        if (editIndex === -1) return;
        const track = tracks[editIndex];
        document.getElementById('modalTitle').textContent = 'Редактировать трек';
        document.getElementById('editTitle').value = track.title;
        document.getElementById('editArtist').value = track.artist;
        tempCoverData = track.cover;
        const preview = document.getElementById('coverPreview');
        if (track.cover) {
            preview.innerHTML = `<img src="${track.cover}" alt="cover">`;
        } else {
            preview.innerHTML = `<span class="placeholder">Нажмите чтобы<br>загрузить обложку</span>`;
        }
        document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('active');
        tempCoverData = null;
        editIndex = null;
    }

    function loadCover(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            tempCoverData = e.target.result;
            const preview = document.getElementById('coverPreview');
            preview.innerHTML = `<img src="${e.target.result}" alt="cover">`;
        };
        reader.readAsDataURL(file);
    }

    function saveTrack() {
        if (editIndex === null || editIndex === -1) return;
        const title = document.getElementById('editTitle').value.trim() || 'Без названия';
        const artist = document.getElementById('editArtist').value.trim() || 'Неизвестный';
        tracks[editIndex].title = title;
        tracks[editIndex].artist = artist;
        if (tempCoverData) {
            tracks[editIndex].cover = tempCoverData;
        }
        saveData();
        renderTracks();
        if (currentTrackId === tracks[editIndex].id) {
            updatePlayerUI();
            updateMediaSession(tracks[editIndex]);
        }
        closeModal();
    }

    // ====================== ИНИЦИАЛИЗАЦИЯ ======================
    loadData();

    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if (e.code === 'ArrowRight') { e.preventDefault(); audio.currentTime += 10; }
        if (e.code === 'ArrowLeft') { e.preventDefault(); audio.currentTime -= 10; }
    });

    console.log('🎵 Плеер загружен! Данные сохраняются в localStorage.');
    console.log('📱 Поддерживает Dynamic Island / Media Session');
</script>

</body>
</html>
