<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0c29">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>🎵 Музыкальный плеер</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json" id="manifestLink">
    <link rel="apple-touch-icon" href="icon-192.png" id="appleIconLink">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            color: #fff;
            overflow-x: hidden;
            user-select: none;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.06);
            min-height: 85vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-actions button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            touch-action: manipulation;
        }
        .header-actions button:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        .header-actions button:active {
            transform: scale(0.95);
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .track-list::-webkit-scrollbar {
            width: 3px;
        }
        .track-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .track-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.04);
            padding: 10px 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.04);
            touch-action: manipulation;
        }
        .track-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
        }
        .track-item:active {
            transform: scale(0.98);
        }
        .track-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
        }
        .track-cover {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            flex-shrink: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .track-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .track-cover .no-cover {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
        }
        .track-info {
            flex: 1;
            min-width: 0;
        }
        .track-title {
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .track-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            border-radius: 8px;
            transition: 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .track-actions button:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .track-actions .edit-btn:hover { color: #60a5fa; }
        .track-actions .delete-btn:hover { color: #f87171; }
        .track-actions button:active {
            transform: scale(0.85);
        }

        .player {
            margin-top: 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .player-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .player-cover {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            flex-shrink: 0;
        }
        .player-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-info {
            flex: 1;
            min-width: 0;
        }
        .player-info .title {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-info .artist {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 4px 0;
        }
        .player-controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .player-controls button:hover {
            background: rgba(255,255,255,0.08);
        }
        .player-controls button:active {
            transform: scale(0.9);
        }
        .player-controls .play-btn {
            background: #3b82f6;
            font-size: 26px;
            width: 50px;
            height: 50px;
        }
        .player-controls .play-btn:hover {
            background: #2563eb;
        }
        .player-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.15);
            outline: none;
            transition: 0.2s;
            touch-action: none;
        }
        .player-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .player-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            border: none;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }
        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .speed-control label {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        .speed-control input {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.15);
            outline: none;
        }
        .speed-control input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
        }
        .speed-control input::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            border: none;
        }
        .speed-control .speed-value {
            font-size: 14px;
            font-weight: 600;
            color: #a78bfa;
            min-width: 36px;
            text-align: center;
        }
        .track-count {
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-left: 8px;
        }
        .loading-text {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.3);
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.3);
        }
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* Модалка иконки - без фона, только изображение */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1e1b4b;
            border-radius: 24px;
            padding: 28px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #e0e7ff;
        }
        .modal-content label {
            display: block;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
            margin-top: 14px;
        }
        .modal-content input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: 0.2s;
        }
        .modal-content input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255,255,255,0.08);
        }
        .modal-content .icon-preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }
        /* Иконка занимает ВСЮ область без фона */
        .modal-content .icon-preview-box {
            width: 150px;
            height: 150px;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            background: transparent;
        }
        .modal-content .icon-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-content .icon-preview-box .placeholder {
            font-size: 64px;
            line-height: 1;
        }
        .modal-content .icon-emoji-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .modal-content .icon-emoji-options button {
            width: 44px;
            height: 44px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-content .icon-emoji-options button:hover {
            background: rgba(255,255,255,0.1);
        }
        .modal-content .icon-emoji-options button.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }
        .modal-content .file-upload-area {
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin: 8px 0;
        }
        .modal-content .file-upload-area:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }
        .modal-content .file-upload-area input {
            display: none;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-actions .save-btn {
            background: #3b82f6;
            color: #fff;
        }
        .modal-actions .save-btn:hover {
            background: #2563eb;
        }
        .modal-actions .cancel-btn {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .modal-actions .cancel-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .modal-track .cover-preview {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            margin: 12px auto;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            border: 2px dashed rgba(255,255,255,0.15);
            transition: 0.3s;
        }
        .modal-track .cover-preview:hover {
            border-color: #3b82f6;
        }
        .modal-track .cover-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-track .cover-preview .placeholder {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
            z-index: 2000;
            animation: slideUp 0.3s ease;
            max-width: 90%;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        #coverInput {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎵 Мой плеер <span class="track-count" id="trackCount"></span></h1>
        <div class="header-actions">
            <button onclick="openIconModal()">🖼️ Иконка</button>
            <button onclick="addTrack()">➕ Добавить</button>
        </div>
    </div>

    <div id="trackListContainer">
        <div class="loading-text">
            <div class="spinner"></div>
            <p style="margin-top: 12px;">Загрузка из базы данных...</p>
        </div>
    </div>

    <div class="player" id="player">
        <div class="player-top">
            <div class="player-cover" id="playerCover">
                <span style="color: rgba(255,255,255,0.3); font-size: 12px;">🎵</span>
            </div>
            <div class="player-info">
                <div class="title" id="playerTitle">Нет трека</div>
                <div class="artist" id="playerArtist">—</div>
            </div>
        </div>
        <div class="player-controls">
            <button onclick="prevTrack()">⏮</button>
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button onclick="nextTrack()">⏭</button>
        </div>
        <input type="range" class="player-slider" id="timeSlider" min="0" max="0" value="0" oninput="seekTrack(this.value)">
        <div class="time-info">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
        <div class="speed-control">
            <label>Скорость</label>
            <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="changeSpeed(this.value)">
            <span class="speed-value" id="speedValue">1.0x</span>
        </div>
    </div>
</div>

<!-- Модалка для иконки PWA -->
<div class="modal" id="iconModal">
    <div class="modal-content">
        <h2>🖼️ Настройка иконки PWA</h2>
        
        <label>Выберите иконку</label>
        <div class="icon-preview-area">
            <div class="icon-preview-box" id="iconPreviewBox">
                <img id="iconPreviewImg" src="" style="display:none;">
                <span class="placeholder" id="iconPlaceholder">🎵</span>
            </div>
            <div class="icon-emoji-options">
                <button onclick="selectEmoji('🎵')" class="active">🎵</button>
                <button onclick="selectEmoji('🎶')">🎶</button>
                <button onclick="selectEmoji('🎧')">🎧</button>
                <button onclick="selectEmoji('🎼')">🎼</button>
                <button onclick="selectEmoji('♪')">♪</button>
                <button onclick="selectEmoji('♫')">♫</button>
                <button onclick="selectEmoji('🎸')">🎸</button>
                <button onclick="selectEmoji('🎹')">🎹</button>
            </div>
        </div>

        <label>Или загрузите свою иконку (PNG с прозрачностью)</label>
        <div class="file-upload-area" onclick="document.getElementById('iconFileInput').click()">
            <div>📁 Нажмите чтобы загрузить PNG</div>
            <div style="font-size:12px;color:rgba(255,255,255,0.3);margin-top:4px;">Рекомендуется 512×512px</div>
            <input type="file" id="iconFileInput" accept="image/png,image/jpeg" onchange="loadCustomIcon(event)">
        </div>

        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeIconModal()">Отмена</button>
            <button class="save-btn" onclick="saveIcon()">💾 Сохранить иконку</button>
        </div>
    </div>
</div>

<!-- Модалка для редактирования трека -->
<div class="modal modal-track" id="editModal">
    <div class="modal-content">
        <h2 id="modalTitle">Редактировать трек</h2>
        <label>Название</label>
        <input type="text" id="editTitle" placeholder="Введите название">
        <label>Исполнитель</label>
        <input type="text" id="editArtist" placeholder="Введите исполнителя">
        <label>Обложка</label>
        <div class="cover-preview" id="coverPreview" onclick="document.getElementById('coverInput').click()">
            <span class="placeholder">Нажмите чтобы<br>загрузить обложку</span>
        </div>
        <input type="file" id="coverInput" accept="image/*" onchange="loadCover(event)">
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeModal()">Отмена</button>
            <button class="save-btn" onclick="saveTrack()">Сохранить</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ====================== ICON STORAGE ======================
    let selectedEmoji = '🎵';
    let customIconData = null;
    let currentIconType = 'emoji';

    function loadIconData() {
        const saved = localStorage.getItem('pwaIconData');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.type === 'emoji') {
                    selectedEmoji = data.emoji || '🎵';
                    currentIconType = 'emoji';
                    customIconData = null;
                } else if (data.type === 'custom' && data.imageData) {
                    customIconData = data.imageData;
                    currentIconType = 'custom';
                }
                updateIconPreview();
            } catch (e) {}
        }
    }

    function saveIconData() {
        const data = {
            type: currentIconType,
            emoji: selectedEmoji,
            imageData: customIconData
        };
        localStorage.setItem('pwaIconData', JSON.stringify(data));
    }

    function selectEmoji(emoji) {
        selectedEmoji = emoji;
        currentIconType = 'emoji';
        customIconData = null;
        document.querySelectorAll('.icon-emoji-options button').forEach(btn => {
            btn.classList.toggle('active', btn.textContent === emoji);
        });
        updateIconPreview();
    }

    function loadCustomIcon(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            customIconData = e.target.result;
            currentIconType = 'custom';
            document.querySelectorAll('.icon-emoji-options button').forEach(btn => {
                btn.classList.remove('active');
            });
            updateIconPreview();
            showToast('✅ Иконка загружена');
        };
        reader.readAsDataURL(file);
    }

    function updateIconPreview() {
        const img = document.getElementById('iconPreviewImg');
        const placeholder = document.getElementById('iconPlaceholder');

        if (currentIconType === 'custom' && customIconData) {
            img.src = customIconData;
            img.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            img.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.textContent = selectedEmoji;
        }
    }

    // ====================== GENERATE ICON ======================
    function generateIconImage(size) {
        return new Promise((resolve) => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Прозрачный фон
            ctx.clearRect(0, 0, size, size);
            
            // Рисуем иконку по центру
            if (currentIconType === 'custom' && customIconData) {
                const img = new Image();
                img.onload = function() {
                    const iconSize = size * 0.85;
                    const ix = (size - iconSize) / 2;
                    const iy = (size - iconSize) / 2;
                    ctx.drawImage(img, ix, iy, iconSize, iconSize);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = function() {
                    // Если не загрузилось, рисуем эмодзи
                    drawEmojiIcon(ctx, size);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = customIconData;
            } else {
                drawEmojiIcon(ctx, size);
                resolve(canvas.toDataURL('image/png'));
            }
        });
    }

    function drawEmojiIcon(ctx, size) {
        const emojiSize = size * 0.7;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${emojiSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = size * 0.05;
        ctx.shadowOffsetY = size * 0.02;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(selectedEmoji, size * 0.5, size * 0.52);
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
    }

    // ====================== SAVE ICON ======================
    async function saveIcon() {
        try {
            const icon192 = await generateIconImage(192);
            const icon512 = await generateIconImage(512);

            saveIconData();

            const link192 = document.createElement('a');
            link192.download = 'icon-192.png';
            link192.href = icon192;
            link192.click();

            setTimeout(() => {
                const link512 = document.createElement('a');
                link512.download = 'icon-512.png';
                link512.href = icon512;
                link512.click();
            }, 200);

            updateManifest(icon192, icon512);

            closeIconModal();
            showToast('✅ Иконка сохранена! Переустановите PWA для обновления');
        } catch (error) {
            console.error('Ошибка сохранения иконки:', error);
            showToast('❌ Ошибка сохранения иконки');
        }
    }

    function updateManifest(icon192Data, icon512Data) {
        const manifest = {
            name: "Музыкальный плеер",
            short_name: "Плеер",
            description: "Музыкальный плеер с хранением в IndexedDB",
            start_url: "/",
            display: "standalone",
            background_color: "#0f0c29",
            theme_color: "#0f0c29",
            orientation: "portrait",
            icons: [
                {
                    src: icon192Data,
                    sizes: "192x192",
                    type: "image/png",
                    purpose: "any maskable"
                },
                {
                    src: icon512Data,
                    sizes: "512x512",
                    type: "image/png",
                    purpose: "any maskable"
                }
            ]
        };

        localStorage.setItem('pwaManifest', JSON.stringify(manifest));

        const manifestLink = document.getElementById('manifestLink');
        if (manifestLink) {
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            manifestLink.href = url;
        }

        const appleIcon = document.getElementById('appleIconLink');
        if (appleIcon) {
            appleIcon.href = icon192Data;
        }
    }

    // ====================== ICON MODAL ======================
    function openIconModal() {
        loadIconData();
        document.getElementById('iconModal').classList.add('active');
    }

    function closeIconModal() {
        document.getElementById('iconModal').classList.remove('active');
    }

    document.getElementById('iconModal').addEventListener('click', function(e) {
        if (e.target === this) closeIconModal();
    });

    // ====================== INDEXEDDB ======================
    const DB_NAME = 'MusicPlayerDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'tracks';

    let db = null;
    let tracks = [];
    let currentTrackId = null;
    let audio = new Audio();
    let isPlaying = false;
    let editTrackId = null;
    let tempCoverData = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
            };
        });
    }

    function getAllTracks() {
        return new Promise((resolve, reject) => {
            if (!db) {
                reject(new Error('База данных не открыта'));
                return;
            }
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    function saveTrackToDB(track) {
        return new Promise((resolve, reject) => {
            if (!db) {
                reject(new Error('База данных не открыта'));
                return;
            }
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.put(track);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    function deleteTrackFromDB(id) {
        return new Promise((resolve, reject) => {
            if (!db) {
                reject(new Error('База данных не открыта'));
                return;
            }
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.delete(id);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    // ====================== РАБОТА С ТРЕКАМИ ======================
    async function loadTracks() {
        try {
            const tracksData = await getAllTracks();
            tracks = tracksData.map(t => ({
                ...t,
                url: t.audioBlob ? URL.createObjectURL(t.audioBlob) : null
            }));
            renderTracks();
            updateTrackCount();
        } catch (error) {
            console.error('Ошибка загрузки треков:', error);
            document.getElementById('trackListContainer').innerHTML = `
                <div class="empty-state">
                    <div class="icon">⚠️</div>
                    <p>Ошибка загрузки базы данных</p>
                </div>
            `;
        }
    }

    async function addTrack() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'audio/*';
        input.multiple = false;
        
        input.onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('audio/')) {
                showToast('⚠️ Пожалуйста, выберите аудиофайл!');
                return;
            }

            try {
                const track = {
                    id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    title: file.name.replace(/\.[^/.]+$/, ''),
                    artist: 'Неизвестный',
                    cover: null,
                    audioBlob: file
                };
                
                await saveTrackToDB(track);
                
                const trackWithUrl = {
                    ...track,
                    url: URL.createObjectURL(file)
                };
                tracks.push(trackWithUrl);
                
                renderTracks();
                updateTrackCount();
                playTrack(trackWithUrl.id);
                showToast('✅ Трек добавлен!');
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                showToast('❌ Не удалось сохранить файл');
            }
        };
        input.click();
    }

    async function deleteTrack(id) {
        const track = tracks.find(t => t.id === id);
        if (!track) return;
        if (!confirm(`Удалить трек "${track.title}"?`)) return;
        
        try {
            await deleteTrackFromDB(id);
            
            const idx = tracks.findIndex(t => t.id === id);
            if (idx === -1) return;
            
            if (tracks[idx].url) {
                URL.revokeObjectURL(tracks[idx].url);
            }
            tracks.splice(idx, 1);
            
            if (currentTrackId === id) {
                audio.pause();
                audio = new Audio();
                isPlaying = false;
                currentTrackId = null;
                updatePlayerUI();
            }
            
            renderTracks();
            updateTrackCount();
            showToast('🗑️ Трек удален');
        } catch (error) {
            console.error('Ошибка удаления:', error);
            showToast('❌ Не удалось удалить трек');
        }
    }

    // ====================== ПЛЕЕР ======================
    function playTrack(id) {
        const track = tracks.find(t => t.id === id);
        if (!track) {
            showToast('❌ Трек не найден');
            return;
        }
        
        // Если нет URL, создаем из Blob
        if (!track.url && track.audioBlob) {
            track.url = URL.createObjectURL(track.audioBlob);
        }
        
        if (!track.url) {
            showToast('❌ Не удалось загрузить трек');
            return;
        }
        
        currentTrackId = id;
        audio.pause();
        audio = new Audio(track.url);
        audio.playbackRate = parseFloat(document.getElementById('speedSlider').value);
        audio.ontimeupdate = updateTime;
        audio.onended = nextTrack;
        audio.onerror = function(e) {
            console.error('Ошибка воспроизведения:', e);
            showToast('❌ Ошибка воспроизведения');
            isPlaying = false;
            updatePlayerUI();
        };
        audio.onloadedmetadata = function() {
            document.getElementById('timeSlider').max = audio.duration;
            document.getElementById('totalTime').textContent = formatTime(audio.duration);
        };
        
        audio.play().then(() => {
            isPlaying = true;
            updatePlayerUI();
            updateMediaSession(track);
        }).catch((err) => {
            console.error('Ошибка воспроизведения:', err);
            isPlaying = false;
            updatePlayerUI();
            showToast('❌ Не удалось воспроизвести');
        });
        
        renderTracks();
        updatePlayerUI();
    }

    function togglePlay() {
        if (!currentTrackId) {
            if (tracks.length > 0) {
                playTrack(tracks[0].id);
            } else {
                showToast('🎵 Нет треков для воспроизведения');
            }
            return;
        }
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
        } else {
            audio.play().then(() => {
                isPlaying = true;
                const track = tracks.find(t => t.id === currentTrackId);
                if (track) updateMediaSession(track);
            }).catch(() => {
                showToast('❌ Ошибка воспроизведения');
            });
        }
        updatePlayerUI();
    }

    function nextTrack() {
        const idx = tracks.findIndex(t => t.id === currentTrackId);
        if (idx === -1 || tracks.length === 0) return;
        const next = (idx + 1) % tracks.length;
        playTrack(tracks[next].id);
    }

    function prevTrack() {
        const idx = tracks.findIndex(t => t.id === currentTrackId);
        if (idx === -1 || tracks.length === 0) return;
        const prev = (idx - 1 + tracks.length) % tracks.length;
        playTrack(tracks[prev].id);
    }

    function seekTrack(value) {
        audio.currentTime = value;
        document.getElementById('currentTime').textContent = formatTime(value);
    }

    function updateTime() {
        const slider = document.getElementById('timeSlider');
        slider.value = audio.currentTime;
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        if (audio.duration) {
            document.getElementById('totalTime').textContent = formatTime(audio.duration);
        }
        const track = tracks.find(t => t.id === currentTrackId);
        if (track && isPlaying) {
            updateMediaSession(track);
        }
    }

    function changeSpeed(val) {
        audio.playbackRate = parseFloat(val);
        document.getElementById('speedValue').textContent = val + 'x';
    }

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // ====================== UI ======================
    function renderTracks() {
        const container = document.getElementById('trackListContainer');
        if (tracks.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🎶</div>
                    <p>Нет треков. Нажмите «Добавить» чтобы загрузить музыку</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = `<div class="track-list">${tracks.map((track) => {
            const isActive = track.id === currentTrackId;
            const coverHtml = track.cover ? 
                `<img src="${track.cover}" alt="cover">` : 
                `<span class="no-cover">🎵</span>`;
            return `
                <div class="track-item ${isActive ? 'active' : ''}" onclick="playTrack('${track.id}')">
                    <div class="track-cover">${coverHtml}</div>
                    <div class="track-info">
                        <div class="track-title">${escapeHtml(track.title)}</div>
                        <div class="track-artist">${escapeHtml(track.artist)}</div>
                    </div>
                    <div class="track-actions">
                        <button class="edit-btn" onclick="event.stopPropagation(); openEdit('${track.id}')">✏️</button>
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteTrack('${track.id}')">🗑️</button>
                    </div>
                </div>
            `;
        }).join('')}</div>`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function updatePlayerUI() {
        const track = tracks.find(t => t.id === currentTrackId);
        const titleEl = document.getElementById('playerTitle');
        const artistEl = document.getElementById('playerArtist');
        const coverEl = document.getElementById('playerCover');
        const playBtn = document.getElementById('playBtn');

        if (track) {
            titleEl.textContent = track.title;
            artistEl.textContent = track.artist;
            coverEl.innerHTML = track.cover ? 
                `<img src="${track.cover}" alt="cover">` : 
                `<span style="color:rgba(255,255,255,0.3);font-size:20px;">🎵</span>`;
        } else {
            titleEl.textContent = 'Нет трека';
            artistEl.textContent = '—';
            coverEl.innerHTML = `<span style="color:rgba(255,255,255,0.3);font-size:20px;">🎵</span>`;
        }
        playBtn.textContent = isPlaying ? '⏸' : '▶';
    }

    function updateTrackCount() {
        document.getElementById('trackCount').textContent = `(${tracks.length})`;
    }

    // ====================== TOAST ======================
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }

    // ====================== MEDIA SESSION ======================
    function updateMediaSession(track) {
        if (!track || !('mediaSession' in navigator)) return;
        try {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.title,
                artist: track.artist,
                album: 'Мой плеер',
                artwork: track.cover ? [
                    { src: track.cover, sizes: '512x512', type: 'image/jpeg' }
                ] : []
            });
            navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
            
            navigator.mediaSession.setActionHandler('play', () => togglePlay());
            navigator.mediaSession.setActionHandler('pause', () => togglePlay());
            navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
            navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime) audio.currentTime = details.seekTime;
            });
        } catch (e) {
            console.log('Media Session не поддерживается');
        }
    }

    // ====================== РЕДАКТИРОВАНИЕ ТРЕКА ======================
    function openEdit(id) {
        editTrackId = id;
        const track = tracks.find(t => t.id === id);
        if (!track) return;
        
        document.getElementById('modalTitle').textContent = 'Редактировать трек';
        document.getElementById('editTitle').value = track.title;
        document.getElementById('editArtist').value = track.artist;
        tempCoverData = track.cover;
        
        const preview = document.getElementById('coverPreview');
        if (track.cover) {
            preview.innerHTML = `<img src="${track.cover}" alt="cover">`;
        } else {
            preview.innerHTML = `<span class="placeholder">Нажмите чтобы<br>загрузить обложку</span>`;
        }
        document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('active');
        tempCoverData = null;
        editTrackId = null;
    }

    function loadCover(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            tempCoverData = e.target.result;
            document.getElementById('coverPreview').innerHTML = `<img src="${e.target.result}" alt="cover">`;
        };
        reader.readAsDataURL(file);
    }

    async function saveTrack() {
        if (!editTrackId) return;
        
        const title = document.getElementById('editTitle').value.trim() || 'Без названия';
        const artist = document.getElementById('editArtist').value.trim() || 'Неизвестный';
        
        try {
            const trackIndex = tracks.findIndex(t => t.id === editTrackId);
            if (trackIndex === -1) return;
            
            tracks[trackIndex].title = title;
            tracks[trackIndex].artist = artist;
            if (tempCoverData) {
                tracks[trackIndex].cover = tempCoverData;
            }
            
            const trackForDB = {
                ...tracks[trackIndex],
                url: undefined
            };
            await saveTrackToDB(trackForDB);
            
            renderTracks();
            if (currentTrackId === tracks[trackIndex].id) {
                updatePlayerUI();
                updateMediaSession(tracks[trackIndex]);
            }
            closeModal();
            showToast('✅ Изменения сохранены');
        } catch (error) {
            console.error('Ошибка сохранения:', error);
            showToast('❌ Не удалось сохранить изменения');
        }
    }

    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // ====================== SERVICE WORKER ======================
    function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('✅ Service Worker зарегистрирован'))
                .catch(err => console.log('❌ Service Worker не зарегистрирован:', err));
        }
    }

    // ====================== ИНИЦИАЛИЗАЦИЯ ======================
    async function init() {
        try {
            await openDB();
            await loadTracks();
            loadIconData();
            registerServiceWorker();
            console.log('✅ База данных подключена');
            console.log(`📊 Загружено треков: ${tracks.length}`);
            
            if (tracks.length > 0) {
                const lastTrack = tracks[tracks.length - 1];
                playTrack(lastTrack.id);
            }
        } catch (error) {
            console.error('❌ Ошибка инициализации:', error);
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if (e.code === 'ArrowRight') { e.preventDefault(); audio.currentTime += 10; }
        if (e.code === 'ArrowLeft') { e.preventDefault(); audio.currentTime -= 10; }
    });

    window.addEventListener('beforeunload', function() {
        tracks.forEach(t => {
            if (t.url) URL.revokeObjectURL(t.url);
        });
    });

    init();
</script>
